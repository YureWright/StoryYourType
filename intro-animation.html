<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Your Type - 线性到树状的蜕变</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
#canvas { width: 800px; height: 600px; position: relative; }
.line { position: absolute; background: #667eea; border-radius: 4px; }
.branch { position: absolute; border-radius: 4px; opacity: 0; }
#title { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 2em; font-family: 'Microsoft YaHei', sans-serif; opacity: 0; text-align: center; }
#subtitle { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #888; font-size: 1em; font-family: 'Microsoft YaHei', sans-serif; opacity: 0; }
</style>
</head>
<body>
<div id="canvas">
  <div id="title">从线性到无限可能</div>
  <div id="subtitle">Story Your Type</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a', '#fee140', '#30cfd0'];

// 创建主线
const mainLine = document.createElement('div');
mainLine.className = 'line';
mainLine.style.cssText = 'left: 400px; top: 500px; width: 4px; height: 0; background: #667eea;';
canvas.appendChild(mainLine);

// 动画时间线
const tl = gsap.timeline();

// 主线生长
tl.to(mainLine, {
  height: 300,
  duration: 1.5,
  ease: 'power2.inOut'
});

// 创建分支
const branches = [];
const branchData = [
  { y: 450, angle: -30, length: 80, color: 0 },
  { y: 420, angle: 25, length: 90, color: 1 },
  { y: 380, angle: -35, length: 100, color: 2 },
  { y: 350, angle: 30, length: 110, color: 3 },
  { y: 320, angle: -25, length: 95, color: 4 },
  { y: 290, angle: 35, length: 105, color: 5 },
  { y: 260, angle: -30, length: 85, color: 6 },
  { y: 230, angle: 28, length: 95, color: 7 },
];

branchData.forEach((data, i) => {
  const branch = document.createElement('div');
  branch.className = 'branch';
  const rad = data.angle * Math.PI / 180;
  const x = 400 + Math.sin(rad) * data.length;
  const y = data.y - Math.cos(rad) * data.length * 0.5;
  branch.style.cssText = `left: 400px; top: ${data.y}px; width: 3px; height: 0; background: ${colors[data.color]}; transform-origin: bottom center;`;
  canvas.appendChild(branch);
  branches.push(branch);
  
  tl.to(branch, {
    height: data.length,
    opacity: 1,
    rotation: data.angle,
    duration: 0.6,
    ease: 'power2.out'
  }, '-=0.3');
  
  // 二级分支
  if (i % 2 === 0) {
    const subBranch = document.createElement('div');
    subBranch.className = 'branch';
    const subAngle = data.angle + (Math.random() > 0.5 ? 40 : -40);
    const subRad = subAngle * Math.PI / 180;
    subBranch.style.cssText = `left: ${x}px; top: ${y}px; width: 2px; height: 0; background: ${colors[(data.color + 2) % colors.length]}; transform-origin: bottom center; opacity: 0;`;
    canvas.appendChild(subBranch);
    
    tl.to(subBranch, {
      height: 50 + Math.random() * 30,
      opacity: 0.8,
      rotation: subAngle,
      duration: 0.5,
      ease: 'power2.out'
    }, '-=0.2');
  }
});

// 显示标题
tl.to('#title', { opacity: 1, duration: 0.8, ease: 'power2.out' }, '-=0.5');
tl.to('#subtitle', { opacity: 1, duration: 0.8, ease: 'power2.out' }, '-=0.3');

// 循环播放
tl.eventCallback('onComplete', () => {
  gsap.delayedCall(2, () => {
    gsap.set('.branch', { opacity: 0, height: 0, rotation: 0 });
    gsap.set(mainLine, { height: 0 });
    gsap.set('#title, #subtitle', { opacity: 0 });
    tl.restart();
  });
});
</script>
</body>
</html>
